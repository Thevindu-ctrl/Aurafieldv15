name: CI/CD Pipeline - Engine Deployment

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Provision Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Restore/Install Dependencies
        run: npm install

      - name: Compile Distribution Assets
        run: npm run build

      - name: Stage Static Distribution Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  publish-deployment:
    needs: validate-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Authorize and Deploy Assets to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4